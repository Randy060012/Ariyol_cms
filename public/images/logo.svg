<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
    <defs>
        <!-- Trajectoire courbe pour le texte supérieur -->
        <path id="textArc" d="M 65,175 A 140,140 0 0,1 335,175" fill="none" />
    </defs>

    <!-- Texte en arc de cercle -->
    <text font-family="'Poppins', sans-serif" font-size="22" font-weight="700" fill="#0c4a80" letter-spacing="3">
        <textPath href="#textArc" startOffset="50%" text-anchor="middle">
            AFRICAN YOUNG LEADERS
        </textPath>
    </text>

    <!-- Silhouette du continent Africain + Madagascar -->
    <g fill="#000000">
        <path d="M 185,100 C 195,98 215,95 235,100 C 255,105 285,120 295,145 C 300,160 290,175 280,185 C 275,190 280,195 295,200 C 310,205 320,220 305,235 C 290,250 265,260 250,280 C 240,295 235,320 220,335 C 210,345 195,330 190,310 C 185,290 175,270 165,255 C 155,240 145,215 150,195 C 155,180 130,175 110,160 C 95,150 100,130 115,115 C 130,100 165,102 185,100 Z" />
        <path d="M 300,285 C 305,280 310,285 308,295 C 305,305 298,315 292,320 C 290,315 292,300 300,285 Z" />
    </g>

    <!-- Rameau d'olivier vert -->
    <g fill="#008a3c">
        <path d="M 160,135 Q 185,150 200,165" stroke="#008a3c" stroke-width="3" fill="none" />
        <ellipse cx="158" cy="132" rx="7" ry="4" transform="rotate(-30 158 132)" />
        <ellipse cx="168" cy="130" rx="7" ry="4" transform="rotate(30 168 130)" />
        <ellipse cx="166" cy="142" rx="7" ry="4" transform="rotate(-40 166 142)" />
        <ellipse cx="178" cy="138" rx="7" ry="4" transform="rotate(20 178 138)" />
        <ellipse cx="176" cy="151" rx="7" ry="4" transform="rotate(-30 176 151)" />
        <ellipse cx="188" cy="148" rx="7" ry="4" transform="rotate(25 188 148)" />
    </g>

    <!-- Colombe de la paix -->
    <g fill="#ffffff" stroke="#e2e8f0" stroke-width="1">
        <!-- Ailes arrière et corps -->
        <path d="M 235,125 C 255,100 275,105 260,135 C 280,110 295,125 270,155 C 290,140 300,155 275,175 C 255,190 235,200 215,205 C 230,220 245,230 255,235 C 235,235 220,220 205,205 C 190,200 175,185 170,170 C 165,160 175,155 185,160 C 170,145 185,135 200,145 C 210,135 225,120 235,125 Z" />
        <!-- Tête et bec -->
        <circle cx="173" cy="168" r="8" fill="#ffffff" />
        <path d="M 167,169 L 157,172 L 166,175 Z" fill="#f59e0b" stroke="none" />
        <circle cx="171" cy="166" r="1.5" fill="#000000" stroke="none" />
    </g>

    <!-- Acronyme AFRIYOL -->
    <text x="200" y="380" font-family="'Poppins', sans-serif" font-size="52" font-weight="900" fill="#0a3663" text-anchor="middle" letter-spacing="2">
        AFRIYOL
    </text>
</svg>
